name: Release candidate gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    name: Static release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/verify-release-readiness.sh
      - run: cargo test -p dexdeck --test schema_freeze

  acceptance:
    name: Complete workspace acceptance
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  android:
    name: Real Android daily loop
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: bash scripts/ci-android-emulator.sh
