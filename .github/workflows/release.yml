name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DIST_VERSION: "0.31.0"

jobs:
  verify-source:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 17.0.19+10
      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dexdeck") | .version')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'tag %s does not match Cargo version %s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: bash scripts/build-bridge.sh
      - run: git diff --exit-code -- bridge/dexdeck-bridge.jar bridge/dexdeck-bridge.jar.sha256
      - run: cargo install cargo-dist --locked --version "$CARGO_DIST_VERSION"
      - run: dist plan --tag "v${{ steps.version.outputs.value }}"

  build:
    name: Build ${{ matrix.target }}
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal --target ${{ matrix.target }}
      - run: cargo build -p dexdeck --release --locked --target ${{ matrix.target }}
      - name: Package reviewed archive
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then suffix=".exe"; fi
          bash scripts/package-release.sh "${{ matrix.target }}" "${{ needs.verify-source.outputs.version }}" "target/${{ matrix.target }}/release/dexdeck${suffix}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: target/distrib/*
          if-no-files-found: error

  publish:
    name: Verify and publish artifacts
    needs: [verify-source, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*
          path: target/distrib
          merge-multiple: true
      - run: bash scripts/verify-release-artifacts.sh target/distrib
      - name: Create aggregate checksums
        run: (cd target/distrib && sha256sum dexdeck-*.tar.gz dexdeck-*.zip | LC_ALL=C sort -k2 > SHA256SUMS)
      - name: Add reviewed installers
        run: cp install/dexdeck-installer.sh install/dexdeck-installer.ps1 target/distrib/
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "target/distrib/*"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "DexDeck ${{ needs.verify-source.outputs.version }}" --notes-file RELEASES.md target/distrib/*
