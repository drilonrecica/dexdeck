name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt

      - name: Cache Cargo data
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            target
          key: cargo-quality-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install cargo-deny
        shell: bash
        run: |
          if ! cargo deny --version 2>/dev/null | grep --quiet 'cargo-deny 0.20.2'; then
            cargo install cargo-deny --locked --version 0.20.2
          fi

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Check dependency policy
        run: cargo deny --all-features check

      - name: Verify tracked files are unchanged
        run: git diff --exit-code

  platforms:
    name: Check ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Cache Cargo data
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Check workspace
        run: cargo check --workspace --all-targets

  focused-contracts:
    name: ${{ matrix.suite }} contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: config-cache
            command: cargo test -p dexdeck-config
          - suite: protocol
            command: cargo test -p dexdeck-protocol --test contracts
          - suite: tui
            command: cargo test -p dexdeck-tui --lib
          - suite: bridge-fixtures
            command: cargo test -p dexdeck-gradle --test modeling_matrix
          - suite: fake-tools
            command: cargo test -p dexdeck-test-support --test fake_tools
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Run focused suite
        run: ${{ matrix.command }}

      - name: Verify suite left tracked files unchanged
        run: git diff --exit-code

  logcat-stress:
    name: Logcat bounded stress
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Run release-mode bounded Logcat stress
        run: cargo test -p dexdeck-core --release --test logcat_stress -- --ignored

  reliability:
    name: Critical failure modes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Run cache, watcher, cancellation, and terminal reliability tests
        run: |
          cargo test -p dexdeck-config
          cargo test -p dexdeck-core process::tests
          cargo test -p dexdeck-core job::tests
          cargo test -p dexdeck-android device::tests
          cargo test -p dexdeck-android logcat::tests
          cargo test -p dexdeck --test terminal_restoration
          cargo test -p dexdeck-gradle --test modeling_matrix
      - name: Verify normal tests leave the project unchanged
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  privacy:
    name: Local-only runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Audit dependencies, source, and runtime syscalls
        run: bash scripts/audit-local-only.sh

  bridge-reproducibility:
    name: Bridge reproducibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned Temurin JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 17.0.19+10

      - name: Rebuild tracked bridge
        run: bash scripts/build-bridge.sh

      - name: Byte-compare bridge artifact
        run: git diff --exit-code -- bridge/dexdeck-bridge.jar bridge/dexdeck-bridge.jar.sha256

  agp-matrix:
    name: AGP ${{ matrix.agp }} bridge
    strategy:
      fail-fast: false
      matrix:
        agp: ["8.0.2", "8.13.0", "9.0.1", "9.3.0"]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned Temurin JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 17.0.19+10

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Cache Cargo and Gradle data
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            target
          key: agp-${{ matrix.agp }}-${{ hashFiles('Cargo.lock', 'bridge/**', 'crates/dexdeck-test-support/**') }}

      - name: Run executable bridge fixtures
        env:
          DEXDECK_AGP_LANE: ${{ matrix.agp }}
          DEXDECK_REAL_AGP_TESTS: "1"
        run: cargo test -p dexdeck-gradle --test real_bridge_matrix models_executable_agp_matrix

      - name: Verify fixtures did not modify tracked files
        run: git diff --exit-code

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit sign-offs
        run: bash scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
