name: Package smoke

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published DexDeck release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    name: Install on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}"
      - name: Verify published checksums
        shell: bash
        run: bash scripts/verify-release-artifacts.sh .
