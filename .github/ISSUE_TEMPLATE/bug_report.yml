name: Bug report
description: Report a reproducible DexDeck defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private source, raw Logcat, or signing data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: DexDeck, OS, terminal, Java, Gradle, AGP, SDK, and device versions.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include only data you have reviewed and redacted.
