[workspace]
members = [
    "crates/dexdeck",
    "crates/dexdeck-android",
    "crates/dexdeck-config",
    "crates/dexdeck-core",
    "crates/dexdeck-gradle",
    "crates/dexdeck-protocol",
    "crates/dexdeck-test-support",
    "crates/dexdeck-tui",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
authors = ["Drilon Recica"]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/drilonrecica/dexdeck"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
criterion = "0.5"
crossterm = "0.28"
directories = "6"
insta = "1"
libc = "0.2"
notify = "8"
proptest = "1"
quick-xml = { version = "0.41", features = ["serialize"] }
ratatui = "0.29"
regex = "1"
rustix = { version = "1", features = ["fs", "process", "pty", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml_edit = { version = "0.22", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
multiple_crate_versions = "allow"
unwrap_used = "warn"

[profile.release]
debug = 1
incremental = false
