[package]
name = "dexdeck"
description = "A fast, private terminal control plane for Android development"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.dist]
dist = true

[dependencies]
clap.workspace = true
dexdeck-android = { version = "0.2.2", path = "../dexdeck-android" }
dexdeck-config = { version = "0.2.2", path = "../dexdeck-config" }
dexdeck-core = { version = "0.2.2", path = "../dexdeck-core" }
dexdeck-gradle = { version = "0.2.2", path = "../dexdeck-gradle" }
dexdeck-protocol = { version = "0.2.2", path = "../dexdeck-protocol" }
dexdeck-tui = { version = "0.2.2", path = "../dexdeck-tui" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
rustix.workspace = true

[[bench]]
name = "operational"
harness = false
